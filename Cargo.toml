[package]
name = "proc-mw"
version = "0.1.0"
edition = "2021"
description = "生产 Service 语义 × 运行期热重载的中间件层 — 八维约束在同一项目中持续验证"

# proc-mw 同时是工作区根；labs/ 是测量台（非系统碎片），
# 用于 D5 编译/动态链接的隔离实验（合成代码生成、独立 dylib 编译单元）。
# labs/d5_incremental、labs/d2_compile_scale 是自包含子 workspace（多 crate 实验），从根排除。
[workspace]
members = ["labs/*"]
exclude = ["labs/d5_incremental", "labs/d2_compile_scale", "labs/d5_lto", "labs/rustc_driver_probe", "labs/scales", "labs/scales/large_multi"]
resolver = "2"

[lib]
name = "proc_mw"
path = "src/lib.rs"

[[bin]]
name = "mw_exec"
path = "src/bin/mw_exec.rs"
required-features = ["runtime"]

[[example]]
name = "d4_bench"
path = "examples/d4_bench.rs"

[[example]]
name = "d6_runtime_load"
path = "examples/d6_runtime_load.rs"
required-features = ["runtime"]

[[example]]
name = "d5_link_cost"
path = "examples/d5_link_cost.rs"
required-features = ["runtime"]

[[example]]
name = "d6_hot_replace"
path = "examples/d6_hot_replace.rs"
required-features = ["runtime"]

[[example]]
name = "d6_multi_plugin"
path = "examples/d6_multi_plugin.rs"
required-features = ["runtime"]

[[example]]
name = "d6_string_plugin"
path = "examples/d6_string_plugin.rs"
required-features = ["runtime"]

[[example]]
name = "d6_runtime_compile"
path = "examples/d6_runtime_compile.rs"
required-features = ["runtime"]

[[example]]
name = "d7_sandbox"
path = "examples/d7_sandbox.rs"
required-features = ["runtime"]

[[example]]
name = "d1_production_asm"
path = "examples/d1_production_asm.rs"

[[example]]
name = "production_chain"
path = "examples/production_chain.rs"
required-features = ["runtime"]

[[example]]
name = "d4_debug_breakdown"
path = "examples/d4_debug_breakdown.rs"

[[example]]
name = "d6_compile_generic"
path = "examples/d6_compile_generic.rs"
required-features = ["runtime"]

[[example]]
name = "d6_load_latency"
path = "examples/d6_load_latency.rs"
required-features = ["runtime"]

[[example]]
name = "d1_opaque_memory"
path = "examples/d1_opaque_memory.rs"
required-features = ["runtime"]

[[example]]
name = "d7_plugin_memory"
path = "examples/d7_plugin_memory.rs"
required-features = ["runtime"]

[dependencies]
futures = "0.3"
libloading = { version = "0.9", optional = true }

[dev-dependencies]
# 直接共享类型路径的测试依赖（usergoals：插件经 crate 依赖引用宿主类型）
shared_types = { path = "labs/shared_types" }

[features]
runtime = ["dep:libloading"]
